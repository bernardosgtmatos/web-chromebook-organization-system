<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Chromebook Manager Pro - Sistema de Agendamento</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            background: white;
            border-radius: 20px;
            padding: 20px 30px;
            margin-bottom: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header h1 {
            font-size: 28px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .stats {
            display: flex;
            gap: 20px;
        }

        .stat-card {
            background: #f3f4f6;
            padding: 10px 20px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-card .number {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
        }

        .stat-card .label {
            font-size: 12px;
            color: #6b7280;
        }

        /* Main Grid */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 25px;
            margin-bottom: 25px;
        }

        @media (max-width: 1024px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Cards */
        .card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        .card-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #1f2937;
            border-left: 4px solid #667eea;
            padding-left: 15px;
        }

        /* Formulário */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #374151;
            font-size: 14px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px 15px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 14px;
            transition: all 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #6b7280;
            color: white;
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }

        .btn-warning {
            background: #f59e0b;
            color: white;
        }

        /* Tabela de Disponibilidade */
        .availability-table {
            width: 100%;
            overflow-x: auto;
        }

        .availability-table table {
            width: 100%;
            border-collapse: collapse;
        }

        .availability-table th,
        .availability-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        .availability-table th {
            background: #f9fafb;
            font-weight: 600;
            color: #374151;
        }

        .status-disponivel {
            color: #10b981;
            font-weight: 600;
        }

        .status-limitado {
            color: #f59e0b;
            font-weight: 600;
        }

        .status-indisponivel {
            color: #ef4444;
            font-weight: 600;
        }

        /* Filtros */
        .filters {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filters input {
            flex: 1;
            padding: 10px 15px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 14px;
        }

        /* Tabela de Agendamentos */
        .agendamentos-table {
            width: 100%;
            overflow-x: auto;
        }

        .agendamentos-table table {
            width: 100%;
            border-collapse: collapse;
        }

        .agendamentos-table th,
        .agendamentos-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        .agendamentos-table th {
            background: #f9fafb;
            font-weight: 600;
            color: #374151;
        }

        .agendamentos-table tr:hover {
            background: #f9fafb;
            cursor: pointer;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            padding: 5px 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
        }

        .btn-edit {
            background: #3b82f6;
            color: white;
        }

        .btn-delete {
            background: #ef4444;
            color: white;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #10b981;
            color: white;
            padding: 12px 20px;
            border-radius: 12px;
            display: none;
            z-index: 1000;
            animation: slideIn 0.3s;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>📱 Chromebook Manager Pro</h1>
            <div class="stats">
                <div class="stat-card">
                    <div class="number" id="totalChromebooks">100</div>
                    <div class="label">Total Disponível</div>
                </div>
                <div class="stat-card">
                    <div class="number" id="totalAgendamentos">0</div>
                    <div class="label">Agendamentos Hoje</div>
                </div>
            </div>
        </div>

        <!-- Main Grid -->
        <div class="main-grid">
            <!-- Disponibilidade por Aula -->
            <div class="card">
                <div class="card-title">📊 Disponibilidade por Aula</div>
                <div class="form-group">
                    <label>Data para Verificação:</label>
                    <input type="date" id="verificaData">
                </div>
                <div class="availability-table">
                    <table id="tabelaDisponibilidade">
                        <thead>
                            <tr>
                                <th>Aula</th>
                                <th>Início</th>
                                <th>Término</th>
                                <th>Disponível</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>

            <!-- Formulário de Agendamento -->
            <div class="card">
                <div class="card-title">📝 Novo Agendamento</div>
                <form id="formAgendamento">
                    <div class="form-group">
                        <label>Professor *</label>
                        <input type="text" id="professor" required placeholder="Nome do professor">
                    </div>
                    <div class="form-group">
                        <label>Turma *</label>
                        <select id="turma" required></select>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Quantidade *</label>
                            <input type="number" id="quantidade" min="1" max="100" value="10" required>
                        </div>
                        <div class="form-group">
                            <label>Data Retirada *</label>
                            <input type="date" id="dataRetirada" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Horário Retirada *</label>
                            <select id="horarioRetirada" required></select>
                        </div>
                        <div class="form-group">
                            <label>Horário Devolução *</label>
                            <select id="horarioDevolucao" required></select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Observações</label>
                        <textarea id="observacoes" rows="3" placeholder="Observações adicionais..."></textarea>
                    </div>
                    <div class="button-group">
                        <button type="submit" class="btn btn-primary">➕ Adicionar</button>
                        <button type="button" class="btn btn-secondary" onclick="limparFormulario()">🗑️ Limpar</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Filtros -->
        <div class="card" style="margin-bottom: 25px;">
            <div class="card-title">🔍 Filtros de Pesquisa</div>
            <div class="filters">
                <input type="text" id="filtroProfessor" placeholder="Filtrar por professor...">
                <input type="date" id="filtroData" placeholder="Filtrar por data...">
                <button class="btn btn-primary" onclick="aplicarFiltros()">Aplicar</button>
                <button class="btn btn-secondary" onclick="limparFiltros()">Limpar</button>
                <button class="btn btn-warning" onclick="exportarRelatorio()">📎 Exportar</button>
            </div>
        </div>

        <!-- Lista de Agendamentos -->
        <div class="card">
            <div class="card-title">📋 Agendamentos Realizados</div>
            <div class="agendamentos-table">
                <table id="tabelaAgendamentos">
                    <thead>
                        <tr>
                            <th>Professor</th>
                            <th>Turma</th>
                            <th>Qtd</th>
                            <th>Data</th>
                            <th>Retirada</th>
                            <th>Devolução</th>
                            <th>Observações</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal Gerenciar Turmas -->
    <div id="modalTurmas" class="modal">
        <div class="modal-content">
            <div class="modal-header">Gerenciar Turmas</div>
            <div id="listaTurmas"></div>
            <div class="form-group" style="margin-top: 20px;">
                <input type="text" id="novaTurma" placeholder="Digite o nome da nova turma">
            </div>
            <div class="button-group">
                <button class="btn btn-primary" onclick="adicionarTurma()">Adicionar Turma</button>
                <button class="btn btn-secondary" onclick="fecharModalTurmas()">Fechar</button>
            </div>
        </div>
    </div>

    <!-- Toast de notificação -->
    <div id="toast" class="toast"></div>

    <script>
        // ============ DADOS E CONFIGURAÇÕES ============
        let agendamentos = [];
        let turmas = [];
        let totalDisponivel = 100;
        
        const horariosAulas = [
            { periodo: "1ª Aula", inicio: "07:00", fim: "07:50" },
            { periodo: "2ª Aula", inicio: "07:50", fim: "08:40" },
            { periodo: "3ª Aula", inicio: "09:00", fim: "09:50" },
            { periodo: "4ª Aula", inicio: "09:50", fim: "10:40" },
            { periodo: "5ª Aula", inicio: "10:40", fim: "11:30" },
            { periodo: "6ª Aula", inicio: "12:20", fim: "13:10" },
            { periodo: "7ª Aula", inicio: "13:10", fim: "14:00" }
        ];
        
        const horariosRetirada = ["07:00", "07:50", "09:00", "09:50", "10:40", "12:20", "13:10"];
        const horariosDevolucao = ["07:50", "08:40", "09:50", "10:40", "11:30", "13:10", "14:00"];
        
        // ============ INICIALIZAÇÃO ============
        function init() {
            carregarDados();
            carregarTurmas();
            preencherHorarios();
            document.getElementById('dataRetirada').valueAsDate = new Date();
            document.getElementById('verificaData').valueAsDate = new Date();
            document.getElementById('formAgendamento').addEventListener('submit', adicionarAgendamento);
            document.getElementById('verificaData').addEventListener('change', atualizarDisponibilidade);
            document.getElementById('filtroProfessor').addEventListener('input', aplicarFiltros);
            document.getElementById('filtroData').addEventListener('change', aplicarFiltros);
            atualizarDisponibilidade();
            atualizarTabelaAgendamentos();
            atualizarStats();
        }
        
        function carregarDados() {
            const saved = localStorage.getItem('chromebook_agendamentos_web');
            if (saved) {
                agendamentos = JSON.parse(saved);
            } else {
                // Dados de exemplo
                const hoje = new Date().toISOString().split('T')[0];
                agendamentos = [
                    {
                        id: Date.now(),
                        professor: "Carla Mendes",
                        turma: "8° Ano A",
                        quantidade: 15,
                        data: hoje,
                        horaRetirada: "07:00",
                        horaDevolucao: "08:40",
                        observacoes: "Projeto de pesquisa"
                    }
                ];
            }
        }
        
        function carregarTurmas() {
            const saved = localStorage.getItem('chromebook_turmas');
            if (saved) {
                turmas = JSON.parse(saved);
            } else {
                turmas = [
                    "6° Ano A", "6° Ano B", "6° Ano C",
                    "7° Ano A", "7° Ano B", "7° Ano C",
                    "8° Ano A", "8° Ano B", "8° Ano C",
                    "9° Ano A", "9° Ano B", "9° Ano C",
                    "1° EM A", "1° EM B", "1° EM C",
                    "2° EM A", "2° EM B", "2° EM C",
                    "3° EM A", "3° EM B", "3° EM C"
                ];
            }
            preencherSelectTurmas();
        }
        
        function preencherSelectTurmas() {
            const select = document.getElementById('turma');
            select.innerHTML = '<option value="">Selecione uma turma</option>';
            turmas.forEach(turma => {
                const option = document.createElement('option');
                option.value = turma;
                option.textContent = turma;
                select.appendChild(option);
            });
        }
        
        function preencherHorarios() {
            const selectRetirada = document.getElementById('horarioRetirada');
            const selectDevolucao = document.getElementById('horarioDevolucao');
            
            selectRetirada.innerHTML = '';
            selectDevolucao.innerHTML = '';
            
            horariosRetirada.forEach(h => {
                const option = document.createElement('option');
                option.value = h;
                option.textContent = h;
                selectRetirada.appendChild(option);
            });
            
            horariosDevolucao.forEach(h => {
                const option = document.createElement('option');
                option.value = h;
                option.textContent = h;
                selectDevolucao.appendChild(option);
            });
            
            selectRetirada.value = "07:00";
            selectDevolucao.value = "14:00";
        }
        
        // ============ FUNÇÕES PRINCIPAIS ============
        function salvarDados() {
            localStorage.setItem('chromebook_agendamentos_web', JSON.stringify(agendamentos));
            localStorage.setItem('chromebook_turmas', JSON.stringify(turmas));
            atualizarStats();
        }
        
        function verificarDisponibilidade(data, horaRetirada, horaDevolucao, quantidade, idIgnorar = null) {
            let totalAgendado = 0;
            
            agendamentos.forEach(ag => {
                if (idIgnorar && ag.id === idIgnorar) return;
                if (ag.data !== data) return;
                
                // Verificar sobreposição de horários
                const inicioExistente = ag.horaRetirada;
                const fimExistente = ag.horaDevolucao;
                
                if (!(horaDevolucao <= inicioExistente || horaRetirada >= fimExistente)) {
                    totalAgendado += ag.quantidade;
                }
            });
            
            const disponivel = totalDisponivel - totalAgendado;
            return { disponivel, totalAgendado, quantidadeSuficiente: quantidade <= disponivel };
        }
        
        function verificarDisponibilidadePorAula(data, aula) {
            let totalAgendado = 0;
            const horaInicio = aula.inicio;
            const horaFim = aula.fim;
            
            agendamentos.forEach(ag => {
                if (ag.data !== data) return;
                
                const inicioAg = ag.horaRetirada;
                const fimAg = ag.horaDevolucao;
                
                if (!(horaFim <= inicioAg || horaInicio >= fimAg)) {
                    totalAgendado += ag.quantidade;
                }
            });
            
            const disponivel = totalDisponivel - totalAgendado;
            return { disponivel, totalAgendado };
        }
        
        function adicionarAgendamento(e) {
            e.preventDefault();
            
            const professor = document.getElementById('professor').value.trim();
            const turma = document.getElementById('turma').value;
            const quantidade = parseInt(document.getElementById('quantidade').value);
            const data = document.getElementById('dataRetirada').value;
            const horaRetirada = document.getElementById('horarioRetirada').value;
            const horaDevolucao = document.getElementById('horarioDevolucao').value;
            const observacoes = document.getElementById('observacoes').value;
            
            if (!professor || !turma) {
                mostrarToast("Preencha todos os campos obrigatórios!", "error");
                return;
            }
            
            const { disponivel, quantidadeSuficiente } = verificarDisponibilidade(data, horaRetirada, horaDevolucao, quantidade);
            
            if (!quantidadeSuficiente) {
                mostrarToast(`Quantidade indisponível! Apenas ${disponivel} chromebook(s) disponível(is) neste horário.`, "error");
                return;
            }
            
            const novoAgendamento = {
                id: Date.now(),
                professor,
                turma,
                quantidade,
                data,
                horaRetirada,
                horaDevolucao,
                observacoes
            };
            
            agendamentos.push(novoAgendamento);
            salvarDados();
            limparFormulario();
            atualizarTabelaAgendamentos();
            atualizarDisponibilidade();
            mostrarToast("Agendamento realizado com sucesso!", "success");
        }
        
        function editarAgendamento(id) {
            const ag = agendamentos.find(a => a.id === id);
            if (!ag) return;
            
            document.getElementById('professor').value = ag.professor;
            document.getElementById('turma').value = ag.turma;
            document.getElementById('quantidade').value = ag.quantidade;
            document.getElementById('dataRetirada').value = ag.data;
            document.getElementById('horarioRetirada').value = ag.horaRetirada;
            document.getElementById('horarioDevolucao').value = ag.horaDevolucao;
            document.getElementById('observacoes').value = ag.observacoes;
            
            deletarAgendamento(id, false);
            mostrarToast("Edite os dados e clique em Adicionar para salvar as alterações.", "info");
        }
        
        function deletarAgendamento(id, confirmar = true) {
            if (confirmar && !confirm("Tem certeza que deseja excluir este agendamento?")) return;
            
            agendamentos = agendamentos.filter(a => a.id !== id);
            salvarDados();
            atualizarTabelaAgendamentos();
            atualizarDisponibilidade();
            mostrarToast("Agendamento removido com sucesso!", "success");
        }
        
        function limparFormulario() {
            document.getElementById('professor').value = '';
            document.getElementById('turma').value = '';
            document.getElementById('quantidade').value = '10';
            document.getElementById('dataRetirada').valueAsDate = new Date();
            document.getElementById('horarioRetirada').value = "07:00";
            document.getElementById('horarioDevolucao').value = "14:00";
            document.getElementById('observacoes').value = '';
        }
        
        // ============ ATUALIZAÇÃO DAS TABELAS ============
        function atualizarDisponibilidade() {
            const data = document.getElementById('verificaData').value;
            if (!data) return;
            
            const tbody = document.querySelector('#tabelaDisponibilidade tbody');
            tbody.innerHTML = '';
            
            horariosAulas.forEach(aula => {
                const { disponivel, totalAgendado } = verificarDisponibilidadePorAula(data, aula);
                
                let status = '';
                let statusClass = '';
                if (disponivel <= 0) {
                    status = '❌ INDISPONÍVEL';
                    statusClass = 'status-indisponivel';
                } else if (disponivel <= 30) {
                    status = '⚠️ LIMITADO';
                    statusClass = 'status-limitado';
                } else {
                    status = '✅ DISPONÍVEL';
                    statusClass = 'status-disponivel';
                }
                
                const row = tbody.insertRow();
                row.insertCell(0).textContent = aula.periodo;
                row.insertCell(1).textContent = aula.inicio;
                row.insertCell(2).textContent = aula.fim;
                row.insertCell(3).textContent = `${disponivel} / ${totalDisponivel}`;
                row.insertCell(4).innerHTML = `<span class="${statusClass}">${status}</span>`;
            });
        }
        
        function atualizarTabelaAgendamentos(filtros = {}) {
            let dadosFiltrados = [...agendamentos];
            
            if (filtros.professor) {
                dadosFiltrados = dadosFiltrados.filter(a => 
                    a.professor.toLowerCase().includes(filtros.professor.toLowerCase())
                );
            }
            if (filtros.data) {
                dadosFiltrados = dadosFiltrados.filter(a => a.data === filtros.data);
            }
            
            dadosFiltrados.sort((a, b) => new Date(b.data) - new Date(a.data));
            
            const tbody = document.querySelector('#tabelaAgendamentos tbody');
            tbody.innerHTML = '';
            
            if (dadosFiltrados.length === 0) {
                const row = tbody.insertRow();
                const cell = row.insertCell(0);
                cell.colSpan = 8;
                cell.textContent = "Nenhum agendamento encontrado";
                cell.style.textAlign = "center";
                cell.style.padding = "40px";
                return;
            }
            
            dadosFiltrados.forEach(ag => {
                const row = tbody.insertRow();
                row.insertCell(0).textContent = ag.professor;
                row.insertCell(1).textContent = ag.turma;
                row.insertCell(2).textContent = ag.quantidade;
                row.insertCell(3).textContent = formatarData(ag.data);
                row.insertCell(4).textContent = ag.horaRetirada;
                row.insertCell(5).textContent = ag.horaDevolucao;
                row.insertCell(6).textContent = ag.observacoes || '—';
                
                const acoesCell = row.insertCell(7);
                acoesCell.className = 'action-buttons';
                acoesCell.innerHTML = `
                    <button class="icon-btn btn-edit" onclick="editarAgendamento(${ag.id})">✏️ Editar</button>
                    <button class="icon-btn btn-delete" onclick="deletarAgendamento(${ag.id})">🗑️ Excluir</button>
                `;
            });
        }
        
        function aplicarFiltros() {
            const professor = document.getElementById('filtroProfessor').value;
            const data = document.getElementById('filtroData').value;
            atualizarTabelaAgendamentos({ professor, data });
        }
        
        function limparFiltros() {
            document.getElementById('filtroProfessor').value = '';
            document.getElementById('filtroData').value = '';
            atualizarTabelaAgendamentos({});
        }
        
        function atualizarStats() {
            document.getElementById('totalChromebooks').textContent = totalDisponivel;
            const hoje = new Date().toISOString().split('T')[0];
            const agendamentosHoje = agendamentos.filter(a => a.data === hoje).length;
            document.getElementById('totalAgendamentos').textContent = agendamentosHoje;
        }
        
        // ============ GERENCIAR TURMAS ============
        function abrirModalTurmas() {
            const modal = document.getElementById('modalTurmas');
            const listaDiv = document.getElementById('listaTurmas');
            
            listaDiv.innerHTML = '<div class="form-group"><label>Turmas cadastradas:</label><select id="selectTurmas" size="10" style="width:100%; padding:10px;"></select></div>';
            const select = document.getElementById('selectTurmas');
            
            turmas.forEach((turma, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = turma;
                select.appendChild(option);
            });
            
            const buttonGroup = document.createElement('div');
            buttonGroup.className = 'button-group';
            buttonGroup.style.marginTop = '10px';
            buttonGroup.innerHTML = `
                <button class="btn btn-secondary" onclick="editarTurma()">✏️ Editar</button>
                <button class="btn btn-danger" onclick="removerTurma()">🗑️ Remover</button>
                <button class="btn btn-primary" onclick="moverTurma(-1)">⬆️ Subir</button>
                <button class="btn btn-primary" onclick="moverTurma(1)">⬇️ Descer</button>
            `;
            listaDiv.appendChild(buttonGroup);
            
            modal.style.display = 'flex';
        }
        
        function adicionarTurma() {
            const novaTurma = document.getElementById('novaTurma').value.trim();
            if (novaTurma && !turmas.includes(novaTurma)) {
                turmas.push(novaTurma);
                salvarDados();
                preencherSelectTurmas();
                document.getElementById('novaTurma').value = '';
                abrirModalTurmas();
                mostrarToast("Turma adicionada com sucesso!", "success");
            } else if (turmas.includes(novaTurma)) {
                mostrarToast("Esta turma já existe!", "error");
            }
        }
        
        function editarTurma() {
            const select = document.getElementById('selectTurmas');
            const index = select.value;
            if (index !== "") {
                const novaTurma = prompt("Digite o novo nome da turma:", turmas[index]);
                if (novaTurma && novaTurma.trim() && !turmas.includes(novaTurma.trim())) {
                    turmas[index] = novaTurma.trim();
                    salvarDados();
                    preencherSelectTurmas();
                    abrirModalTurmas();
                    mostrarToast("Turma editada com sucesso!", "success");
                } else if (turmas.includes(novaTurma)) {
                    mostrarToast("Este nome já existe!", "error");
                }
            }
        }
        
        function removerTurma() {
            const select = document.getElementById('selectTurmas');
            const index = select.value;
            if (index !== "" && confirm("Tem certeza que deseja remover esta turma?")) {
                turmas.splice(index, 1);
                salvarDados();
                preencherSelectTurmas();
                abrirModalTurmas();
                mostrarToast("Turma removida com sucesso!", "success");
            }
        }
        
        function moverTurma(direcao) {
            const select = document.getElementById('selectTurmas');
            const index = parseInt(select.value);
            const novoIndex = index + direcao;
            
            if (novoIndex >= 0 && novoIndex < turmas.length) {
                [turmas[index], turmas[novoIndex]] = [turmas[novoIndex], turmas[index]];
                salvarDados();
                preencherSelectTurmas();
                abrirModalTurmas();
                setTimeout(() => {
                    const newSelect = document.getElementById('selectTurmas');
                    newSelect.value = novoIndex;
                }, 100);
            }
        }
        
        function fecharModalTurmas() {
            document.getElementById('modalTurmas').style.display = 'none';
        }
        
        // ============ EXPORTAÇÃO ============
        function exportarRelatorio() {
            if (agendamentos.length === 0) {
                mostrarToast("Não há dados para exportar!", "error");
                return;
            }
            
            let csv = "Professor,Turma,Quantidade,Data,Horário Retirada,Horário Devolução,Observações\n";
            agendamentos.forEach(ag => {
                csv += `"${ag.professor}","${ag.turma}",${ag.quantidade},"${ag.data}","${ag.horaRetirada}","${ag.horaDevolucao}","${ag.observacoes || ''}"\n`;
            });
            
            const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.href = url;
            link.setAttribute("download", `agendamentos_${new Date().toISOString().split('T')[0]}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
            
            mostrarToast("Relatório exportado com sucesso!", "success");
        }
        
        // ============ UTILITÁRIOS ============
        function formatarData(data) {
            if (!data) return '';
            const partes = data.split('-');
            return `${partes[2]}/${partes[1]}/${partes[0]}`;
        }
        
        function mostrarToast(mensagem, tipo = "success") {
            const toast = document.getElementById('toast');
            toast.textContent = mensagem;
            toast.style.backgroundColor = tipo === "success" ? "#10b981" : tipo === "error" ? "#ef4444" : "#3b82f6";
            toast.style.display = "block";
            setTimeout(() => {
                toast.style.display = "none";
            }, 3000);
        }
        
        // Adicionar botão de gerenciar turmas no header
        const header = document.querySelector('.header');
        const btnGerirTurmas = document.createElement('button');
        btnGerirTurmas.textContent = '📚 Gerenciar Turmas';
        btnGerirTurmas.className = 'btn btn-secondary';
        btnGerirTurmas.onclick = abrirModalTurmas;
        btnGerirTurmas.style.marginLeft = 'auto';
        header.appendChild(btnGerirTurmas);
        
        // Inicializar
        init();
    </script>
</body>
</html>
